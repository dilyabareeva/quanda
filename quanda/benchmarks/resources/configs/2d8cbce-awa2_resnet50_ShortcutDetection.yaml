model:
  pretrained_model_name: null
  module:
    name: ResNet50
    args:
      num_classes: 50
  trainer:
    optimizer: sgd
    optimizer_kwargs:
      momentum: 0.9
      nesterov: true
      weight_decay: 0.0001
    criterion: cross_entropy
    criterion_kwargs: {}
    scheduler: one_cycle
    scheduler_kwargs:
      interval: step
      max_lr: 0.1
      anneal_strategy: cos
      pct_start: 0.1
      div_factor: 25.0
    lr: 0.1
    max_epochs: 30
    seed: 42
    num_workers: 8
train_dataset:
  dataset_str: quanda-bench-test/awa2
  dataset_split: train
  transforms: none
  wrapper:
    type: SampleTransformationDataset
    metadata:
      metadata_filename: awa2_train_shortcut_transform_indices.yaml
      p: 0.5
      cls_idx: 0
      seed: 42
    sample_fn: add_pink_frame
    dataset_transform: awa2_train_transforms
  split_ref: awa2_train_shortcut
  split_name: train
eval_dataset:
  dataset_str: quanda-bench-test/awa2
  dataset_split: train
  transforms: none
  filter_indices:
    split_filename: awa2_eval_shortcut_filter.yaml
    split_name: default
  wrapper:
    type: SampleTransformationDataset
    metadata:
      metadata_filename: awa2_eval_shortcut_split.yaml
      p: 1.0
      seed: 42
    sample_fn: add_pink_frame
    dataset_transform: awa2_transforms
  split_ref: awa2_train_shortcut
  split_name: test
val_dataset:
  dataset_str: quanda-bench-test/awa2
  dataset_split: train
  transforms: none
  wrapper:
    type: SampleTransformationDataset
    metadata:
      metadata_filename: awa2_val_shortcut.yaml
      p: 0.3
      cls_idx: 0
      seed: 42
    sample_fn: add_pink_frame
    dataset_transform: awa2_transforms
  split_ref: awa2_train_shortcut
  split_name: val
id: 2d8cbce-awa2_resnet50_ShortcutDetection
bench: ShortcutDetection
adversarial_label: 0
bench_save_dir: /data2/bareeva/Projects/quanda/cluster_output_new2/eval_bench/awa2
log_dir: hydra_logs
repo_id: quanda-bench-test
cache_dir: tmp
top_k: 5
model_id: '0'
correlation_fn: spearman
offline: true
seed: 42
device: cuda:0
batch_size: 128
m: 100
alpha: 0.5
subset_ids: lds_subsets.yaml
ckpt: quanda-bench-test/2d8cbce-awa2_resnet50_ShortcutDetection
num_checkpoints: 5
meta_id: quanda-bench-test/2d8cbce-awa2_resnet50_ShortcutDetection_metadata
splits:
  awa2_train:
    filename: awa2_train_split.yaml
    ratios:
      train: 0.8
      val: 0.1
      test: 0.1
    seed: 42
  awa2_train_subclass:
    filename: awa2_train_subclass_split.yaml
    ratios:
      train: 0.8
      val: 0.1
      test: 0.1
    seed: 42
  awa2_train_shortcut:
    filename: awa2_train_shortcut_split.yaml
    ratios:
      train: 0.8
      val: 0.1
      test: 0.1
    seed: 42
  awa2_train_mislabeling:
    filename: awa2_train_mislabeling_split.yaml
    ratios:
      train: 0.8
      val: 0.1
      test: 0.1
    seed: 42
  awa2_train_mixed:
    filename: awa2_train_mixed_split.yaml
    ratios:
      train: 0.8
