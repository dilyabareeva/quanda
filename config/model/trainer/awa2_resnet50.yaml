# Trainer configuration for ResNet50 on AwA2.
# Note: ``optimizer_kwargs`` is shared across optimizers in the sweep
# (adam, sgd) — keep it to flags both accept (e.g. weight_decay).
optimizer: "adam"
optimizer_kwargs:
  weight_decay: 1.0e-4

criterion: "cross_entropy"
criterion_kwargs: {}

scheduler: "one_cycle"
scheduler_kwargs:
  interval: "step"
  max_lr: ${..lr}
  anneal_strategy: "cos"
  pct_start: 0.1
  div_factor: 25.0

lr: 1.0e-3
max_epochs: 30
seed: 42
num_workers: 8
